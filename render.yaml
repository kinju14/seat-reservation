# Render Blueprint: New > Blueprint > pick this repo. Then set ADMIN_TOKEN in the dashboard.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /healthz        # liveness only; /readyz is for you/graders
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: seat-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false                  # you choose it, then hand it to the graders
      - key: DB_POOL_MAX
        value: "15"                  # stay under the free-tier Postgres connection limit
databases:
  - name: seat-db
    plan: free
