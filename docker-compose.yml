services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/seats
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
    ports:
      - "8000:8000"
